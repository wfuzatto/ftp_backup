name: build-windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\ftp_backup.sln -r win-x64

      - name: Build
        run: dotnet build .\ftp_backup.sln -c Release -r win-x64 --no-restore

      - name: Publish service
        run: dotnet publish .\src\FtpBackup.Service\FtpBackup.Service.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\artifacts\service

      - name: Publish tray
        run: dotnet publish .\src\FtpBackup.Tray\FtpBackup.Tray.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\artifacts\tray
